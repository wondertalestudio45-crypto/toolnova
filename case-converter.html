<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Converter - ToolNova</title>
<meta name="description" content="Free case converter. UPPERCASE, lowercase, Title Case and Sentence case.">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><div class="wrap nav">
 <a href="../index.html" class="logo">TOOL<span>NOVA</span><small>Free Online Tools for Everyone</small></a>
 <nav><a href="../index.html">Home</a><a href="../index.html#popular">All Tools</a></nav>
</div></header>
<main class="wrap page">
 <h1>Case Converter</h1><p class="lead">Paste text and choose a case.</p>
 <div class="box">
  <textarea id="t" placeholder="Type or paste your text here..."></textarea>
  <button class="btn" data-m="up">UPPERCASE</button>
  <button class="btn" data-m="lo">lowercase</button>
  <button class="btn" data-m="ti">Title Case</button>
  <button class="btn" data-m="se">Sentence case</button>
 </div>
 <div class="box faq">
  <h2>Frequently asked questions</h2>
  <h3>What is Title Case?</h3><p>The first letter of every word is capital.</p>
 </div>
</main>
<footer><a href="../about.html">About</a> &nbsp;|&nbsp; <a href="../contact.html">Contact</a> &nbsp;|&nbsp; <a href="../privacy-policy.html">Privacy Policy</a> &nbsp;|&nbsp; <a href="../terms.html">Terms</a><br>© 2026 ToolNova. All rights reserved.</footer>
<script>
const t=document.getElementById("t");
const F={
 up:s=>s.toUpperCase(),lo:s=>s.toLowerCase(),
 ti:s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()),
 se:s=>s.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase())
};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>t.value=F[b.dataset.m](t.value));
</script>
</body>
</html>
