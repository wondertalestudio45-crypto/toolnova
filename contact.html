<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us - ToolNova</title>
<meta name="description" content="Contact ToolNova for feedback, tool requests or business enquiries.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="wrap nav">
 <a href="index.html" class="logo">TOOL<span>NOVA</span><small>Free Online Tools for Everyone</small></a>
 <nav><a href="index.html">Home</a><a href="index.html#popular">All Tools</a><a href="contact.html">Contact</a></nav>
</div></header>
<main class="wrap page">
 <h1>Contact Us</h1><p class="lead">We read every message.</p>
 <div class="box">
  <p>Email: <a href="mailto:YOUR_EMAIL@gmail.com">YOUR_EMAIL@gmail.com</a></p>
  <p>You can write to us about bugs, new tool ideas or advertising.</p>
  <input type="text" id="nm" placeholder="Your name" style="width:100%;padding:12px;border:1px solid #cdd7ee;border-radius:10px;margin-bottom:12px">
  <textarea id="msg" placeholder="Your message" style="min-height:120px"></textarea>
  <button class="btn" id="go">Send by email</button>
 </div>
</main>
<footer><a href="about.html">About</a> &nbsp;|&nbsp; <a href="contact.html">Contact</a> &nbsp;|&nbsp; <a href="privacy-policy.html">Privacy Policy</a> &nbsp;|&nbsp; <a href="terms.html">Terms</a><br>© 2026 ToolNova. All rights reserved.</footer>
<script>
document.getElementById("go").onclick=()=>{
 const n=document.getElementById("nm").value,m=document.getElementById("msg").value;
 location.href="mailto:YOUR_EMAIL@gmail.com?subject="+encodeURIComponent("ToolNova message from "+n)+"&body="+encodeURIComponent(m);
};
</script>
</body>
</html>
