<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Converter - ToolNova</title>
<meta name="description" content="Free image converter. Convert JPG, PNG and WebP online.">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><div class="wrap nav">
 <a href="../index.html" class="logo">TOOL<span>NOVA</span><small>Free Online Tools for Everyone</small></a>
 <nav><a href="../index.html">Home</a><a href="../index.html#popular">All Tools</a><a href="../contact.html">Contact</a></nav>
</div></header>
<main class="wrap page">
 <h1>Image Converter</h1><p class="lead">Your image stays on your device.</p>
 <div class="box">
  <input type="file" id="f" accept="image/*" style="margin-bottom:12px">
  <select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
  <img id="pv" alt="" style="max-width:100%;margin:12px 0;display:none;border-radius:10px"><br>
  <a id="dl" class="btn" style="display:none" download="converted">Download</a>
 </div>
 <div class="box faq">
  <h2>Frequently asked questions</h2>
  <h3>Is my image uploaded?</h3><p>No. Conversion happens in your browser.</p>
 </div>
</main>
<footer><a href="../about.html">About</a> &nbsp;|&nbsp; <a href="../contact.html">Contact</a> &nbsp;|&nbsp; <a href="../privacy-policy.html">Privacy Policy</a> &nbsp;|&nbsp; <a href="../terms.html">Terms</a><br>© 2026 ToolNova. All rights reserved.</footer>
<script>
const $=id=>document.getElementById(id);let img=null;
function run(){
 if(!img)return;
 const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
 const x=c.getContext("2d");if($("fmt").value==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0);
 c.toBlob(b=>{const u=URL.createObjectURL(b);$("pv").src=u;$("pv").style.display="block";$("dl").href=u;$("dl").download="converted."+$("fmt").value.split("/")[1].replace("jpeg","jpg");$("dl").style.display="inline-block"},$("fmt").value,0.92);
}
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;run()};i.src=URL.createObjectURL(f)};
$("fmt").onchange=run;
</script>
</body>
</html>
